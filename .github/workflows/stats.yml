name: Refresh stats cards

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.STATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Stop if no token is set
        id: guard
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "STATS_TOKEN is not set; keeping the committed cards."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip != 'true'
        run: python scripts/build_stats.py
      - if: steps.guard.outputs.skip != 'true'
        run: |
          git add stats.svg langs.svg activity.svg leetcode.svg
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh stats cards"
          git push
